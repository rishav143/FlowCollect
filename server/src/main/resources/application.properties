spring.application.name=flowcollect

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cashclarity}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
# spring.jpa.database-platform is auto-detected — no need to set it explicitly
spring.jpa.hibernate.ddl-auto=update


# JWT (no Spring Security)
jwt.secret=${JWT_SECRET:your-256-bit-secret-change-in-production-must-be-at-least-32-chars}
jwt.expiration-ms=86400000

# Scheduler
scheduler.enabled=true
scheduler.invoice-status.cron=0 * * * * *
#scheduler.reminder.cron=0 */15 * * * *
scheduler.reminder.cron=0/15 * * * * *
# Max age (days) a PENDING automated follow-up may sit before being cancelled instead
# of dispatched. Prevents a burst of stale reminders after a scheduler outage.
# Set to 0 to disable the staleness check entirely.
scheduler.reminder.max-pending-age-days=1

# Email delivery (Resend SMTP — https://resend.com)
# RESEND_API_KEY  → your Resend API key (re_...)
# RESEND_FROM     → verified sender address, e.g. noreply@yourdomain.com
#                   (use onboarding@resend.dev for local testing without a domain)
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.email.from-address=${RESEND_FROM:billing@flowcollect.io}
notification.email.auth-from-address=${RESEND_AUTH_FROM:noreply@flowcollect.io}
notification.email.from-name=${NOTIFICATION_EMAIL_FROM_NAME:FlowCollect}

# Twilio delivery (SMS only)
twilio.enabled=${TWILIO_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.sms-from=${TWILIO_SMS_FROM:}

# WhatsApp Cloud API delivery
whatsapp.cloud.enabled=${WHATSAPP_CLOUD_ENABLED:false}
whatsapp.cloud.access-token=${WHATSAPP_CLOUD_ACCESS_TOKEN:}
whatsapp.cloud.api-version=${WHATSAPP_CLOUD_API_VERSION:v23.0}
whatsapp.cloud.phone-number-id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID:}

# Application base URL (used in payment link public URLs and gateway callbacks)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Stripe payment gateway (Stripe Connect — each org links their own account)
# STRIPE_ENABLED=true activates the provider
# STRIPE_API_KEY — platform secret key (sk_live_... or sk_test_...)
# STRIPE_CONNECT_CLIENT_ID — platform Connect client ID (ca_...) from Stripe Dashboard
# STRIPE_WEBHOOK_SECRET — platform webhook signing secret for Connect events
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api-key=${STRIPE_API_KEY:}
stripe.connect-client-id=${STRIPE_CONNECT_CLIENT_ID:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Razorpay payment gateway (UPI + cards; primarily INR)
# Set RAZORPAY_ENABLED=true and supply keys to activate
razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Payment link expiry scheduler (runs daily at midnight)
scheduler.payment-link-expiry.cron=${SCHEDULER_PAYMENT_LINK_EXPIRY_CRON:0 0 0 * * *}

# Gateway credential encryption (AES-256)
# In production, set GATEWAY_ENCRYPTION_KEY to a secure 32+ character secret
gateway.encryption.key=${GATEWAY_ENCRYPTION_KEY:local-dev-encryption-key-change-me}

# Google OAuth 2.0 (sign-in with Google)
# Register at https://console.cloud.google.com/ -> APIs & Services -> Credentials
# Authorized redirect URIs must include your frontend callback URL
oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Microsoft OAuth 2.0 (sign-in with Microsoft / Azure AD)
# Register at https://portal.azure.com/ -> Azure Active Directory -> App registrations
# Set oauth.microsoft.tenant to your directory tenant ID to restrict to a single org,
# or leave as "common" to allow any Microsoft personal/work account
oauth.microsoft.client-id=${MICROSOFT_OAUTH_CLIENT_ID:}
oauth.microsoft.client-secret=${MICROSOFT_OAUTH_CLIENT_SECRET:}
oauth.microsoft.tenant=${MICROSOFT_OAUTH_TENANT:common}

#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=false
# Note: spring.jpa.database-platform is auto-detected in prod — remove it if you see dialect warnings
