<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3044"/>
      <stop offset="100%" stop-color="#1B2838"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg_grad)"/>
  <!-- Connection lines -->
  <line x1="148" y1="358" x2="256" y2="256" stroke="#2E7A8E" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <line x1="256" y1="256" x2="364" y2="148" stroke="#2E7A8E" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <line x1="256" y1="256" x2="374" y2="292" stroke="#2E7A8E" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- Outer nodes -->
  <circle cx="148" cy="358" r="44" fill="#2E7A8E" opacity="0.9"/>
  <circle cx="148" cy="358" r="32" fill="none" stroke="#29B6F6" stroke-width="2" opacity="0.3"/>
  <circle cx="364" cy="148" r="44" fill="#2E7A8E" opacity="0.9"/>
  <circle cx="364" cy="148" r="32" fill="none" stroke="#29B6F6" stroke-width="2" opacity="0.3"/>
  <circle cx="374" cy="292" r="40" fill="#2E7A8E" opacity="0.9"/>
  <circle cx="374" cy="292" r="28" fill="none" stroke="#29B6F6" stroke-width="2" opacity="0.3"/>
  <!-- Center node (bigger, with glow) -->
  <circle cx="256" cy="256" r="62" fill="url(#accent_grad)" filter="url(#glow)"/>
  <!-- Checkmark -->
  <path d="M232 258 L250 278 L284 240" fill="none" stroke="#1B2838" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small dot accents for precision feel -->
  <circle cx="148" cy="358" r="6" fill="#29B6F6" opacity="0.7"/>
  <circle cx="364" cy="148" r="6" fill="#29B6F6" opacity="0.7"/>
  <circle cx="374" cy="292" r="5" fill="#29B6F6" opacity="0.7"/>
</svg>